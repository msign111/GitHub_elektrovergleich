<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden – Macher Elektro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --text:#0a0a0a; --muted:#6b7280; --hairline:#ececee; --accent:#12a150; --accent-weak:#f0faf4;
                --primary:#0a0a0a; --surface-2:#fbfbfd; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            color: var(--text); background: #fff; -webkit-font-smoothing: antialiased; position: relative; overflow: hidden;
        }
        body::before { content:""; position: fixed; top:-240px; right:-180px; width:680px; height:680px;
            background: radial-gradient(circle, rgba(18,161,80,.16), rgba(18,161,80,0) 68%); }
        body::after { content:""; position: fixed; bottom:-280px; left:-200px; width:620px; height:620px;
            background: radial-gradient(circle, rgba(10,90,210,.10), rgba(10,90,210,0) 68%); }
        .box { position: relative; z-index: 1; width: 100%; max-width: 400px; background: #fff;
            border: 1px solid #e7ece8; border-radius: 24px; padding: 34px;
            box-shadow: 0 24px 70px rgba(16,90,60,.12), 0 2px 10px rgba(0,0,0,.04); }
        /* Eigene Marken-Schrift: Sora für Logo und Überschriften */
        .logo, h1 { font-family: 'Sora', 'Inter', -apple-system, sans-serif; }
        .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; margin-bottom: 22px; }
        .logo .bolt { width: 22px; height: 22px; }
        .logo .lite { color: var(--muted); font-weight: 600; }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
        p.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; }
        label { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 8px; }
        input[type=password] {
            width: 100%; font: inherit; font-size: 16px; padding: 13px 16px; border: 1px solid var(--hairline);
            border-radius: 14px; background: var(--surface-2); transition: border-color .2s, background .2s;
        }
        input[type=password]:focus { outline: none; border-color: var(--accent); background: #fff; }
        button { width: 100%; margin-top: 16px; border: none; border-radius: 999px; background: var(--primary); color: #fff;
            padding: 14px; font: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .12s; }
        button:hover { opacity: .88; }
        button:active { transform: scale(.98); }
        .fehler { background: #fdecea; color: #b4231a; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <span class="logo">
            <svg class="bolt" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="mimpuls" x1="3" y1="19" x2="21" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#0e8a44"/><stop offset="1" stop-color="#84cc16"/></linearGradient></defs><path d="M3 18.5 L7 6.5 L12 14.5 L17 6.5 L21 18.5" stroke="url(#mimpuls)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Macher<span class="lite">Elektro</span>
        </span>
        <h1>Anmelden</h1>
        <p class="sub">Diese Vorschau ist passwortgeschützt. Bitte gib das Passwort ein.</p>

        {% if fehler %}
        <div class="fehler">Falsches Passwort. Bitte nochmal versuchen.</div>
        {% endif %}

        <form action="/login" method="post">
            <label for="passwort">Passwort</label>
            <input type="password" id="passwort" name="passwort" autofocus required placeholder="••••••••">
            <button type="submit">Weiter</button>
        </form>
    </div>
</body>
</html>
